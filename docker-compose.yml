services:
  postgres:
    image: postgres:16-alpine
    container_name: snaptle-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-snaptle}
      POSTGRES_USER: ${DB_USERNAME:-snaptle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-snaptle}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - snaptle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-snaptle}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  snaptle-postgres-data:
